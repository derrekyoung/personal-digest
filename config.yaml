# YouTube channels to monitor.
# You can use any of these formats — the app resolves them to channel IDs automatically
# and caches the result so the lookup only happens once per entry.
#
#   @handle:      @mkbhd
#   Full URL:     https://www.youtube.com/@mkbhd
#   Legacy URL:   https://www.youtube.com/c/mkbhd
#   Channel URL:  https://www.youtube.com/channel/UCBcRF18a7Qf58cCRy5xuWwQ
#   Bare ID:      UCBcRF18a7Qf58cCRy5xuWwQ
channels:
  - "https://www.youtube.com/@ai-agents-podcast"
  - "https://www.youtube.com/@AIDailyBrief"
  - "https://www.youtube.com/@SkillLeapAI"
  - "https://www.youtube.com/@ai-foundations"
  - "https://www.youtube.com/@aiexplained-official"
  - "https://www.youtube.com/@mreflow"
  - "https://www.youtube.com/@Fireship"
  - "https://www.youtube.com/@LennysPodcast"

# How many hours back to look for new videos (default: 48)
max_age_hours: 168

# Your areas of interest. Used to focus summaries and surface relevant insights.
interests:
  - AI productivity
  - agentic AI
  - practical usage of AI

# Where to write digest files (default: output/ inside the project directory)
# Use an absolute path to write somewhere else, e.g. a Dropbox or Obsidian folder.
# output_dir: ~/Documents/Digests

# Email delivery (optional). Remove the comment characters to enable.
# Store the password in the DIGEST_EMAIL_PASSWORD environment variable instead
# of writing it here, to keep credentials out of version control.
#
# email:
#   enabled: false              # set to true to send the digest by email
#   smtp_host: smtp.gmail.com   # or smtp.mail.me.com for iCloud, etc.
#   smtp_port: 587
#   username: you@gmail.com
#   from: you@gmail.com
#   to:
#     - you@example.com
#     - someone@example.com
